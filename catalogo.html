<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Catálogo | Renkai</title>

    <link rel="stylesheet"
          href="css/styles.css">

</head>

<body>

<header>

    <div class="logo">

        <a href="index.html">
            RENKAI
        </a>

    </div>

    <nav>

        <ul>

            <li>

                <a href="index.html">
                    Inicio
                </a>

            </li>

            <li>

                <a href="#cart">

                    🛒

                    <span id="cart-count">

                        0

                    </span>

                </a>

            </li>

        </ul>

    </nav>

</header>

<section class="section">

    <h2>
        Catálogo Completo
    </h2>

    <div class="filter-container">

        <input
            type="text"
            id="searchInput"
            placeholder="Buscar figura...">

        <select id="categoryFilter">

            <option value="todas">
                Todas las categorías
            </option>

            <option value="original">
                Originales
            </option>

            <option value="replica">
                Réplicas
            </option>

            <option value="resina">
                Resinas
            </option>

        </select>

    </div>

    <div
        id="productos-container"
        class="products">

    </div>

    <div class="pagination">

        <button
            id="prev-page"
            class="btn">

            ← Anterior

        </button>

        <span id="page-info">

            Página 1

        </span>

        <button
            id="next-page"
            class="btn">

            Siguiente →

        </button>

    </div>

</section>

<section
    id="cart"
    class="section">

    <h2>
        Carrito de Compras
    </h2>

    <div id="cart-items">

    </div>

    <h3 id="cart-total">

        Total: $0 COP

    </h3>

    <div style="text-align:center;">

        <button
            id="clear-cart"
            class="btn">

            Vaciar Carrito

        </button>

    </div>

</section>

<footer>

    <p>

        © 2026 Renkai Store.
        Todos los derechos reservados.

    </p>

</footer>

<script src="js/productos.js"></script>
<script src="js/script.js"></script>

</body>

</html>
